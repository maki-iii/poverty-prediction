# =====================================================================
# Master config for the poverty prediction pipeline.
# Editing THIS file is the only thing needed to:
#   - add/remove an ML model from the comparison
#   - change hyperparameters
#   - change the forecast horizon
#   - change which columns are features vs. target
# =====================================================================

region: "NCR"

# Active pipeline uses threshold-filtered FIES observations only.
data_history: fies_only
require_poverty_threshold: true

target_column: "poverty_incidence"

feature_columns:
  - avg_household_income
  - avg_household_expenditure
  - avg_family_size

# ---------------------------------------------------------------------
# ARIMA settings
# ---------------------------------------------------------------------
arima:
  forecast_horizon_years: 3         # fixed three-year window after latest actual/interpolated year
  auto_order_selection: true        # past-only indicator validation selects order and drift
  seasonal: false                   # annual data, no seasonality
  fallback_order: [1, 1, 1]         # fixed specification when auto_order_selection is false

# ---------------------------------------------------------------------
# ML model comparison
# Add a new model by:
#   1. creating src/models/ml/algorithms/<name>_model.py implementing base_model.BaseModel
#   2. registering it in src/models/ml/model_factory.py
#   3. adding an entry here
# ---------------------------------------------------------------------
ml:
  validation_method: kfold  # experimental; use time_series to restore chronological validation
  active_models:
    - xgboost
    - ridge
    - random_forest

  min_train_size: 5      # minimum observed targets before a validation origin
  random_state: 42
  cv_folds: 5             # K-fold splits, or maximum chronological windows

  # Small-data regularization, selected only inside each training window.
  tuning:
    ridge:
      ridge__alpha: [0.1, 1.0, 10.0, 100.0, 1000.0]
    random_forest:
      max_depth: [2, 4]
      min_samples_leaf: [2, 4]
    xgboost:
      max_depth: [1, 2]
      reg_lambda: [1.0, 10.0]

  selection_metric: "rmse"  # which metric decides the "best" model: rmse | mae | r2

  hyperparameters:
    xgboost:
      n_estimators: 300
      max_depth: 4
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42

    ridge:
      alpha: 1.0
      random_state: 42

    random_forest:
      n_estimators: 300
      max_depth: 6
      min_samples_leaf: 2
      random_state: 42
